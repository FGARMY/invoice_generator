<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="adbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Stylized Packaging Box Icon -->
  <g transform="translate(6, 10)">
    <!-- Box isometric faces -->
    <path d="M30 4 L56 18 L30 32 L4 18 Z" fill="url(#adbGrad)"/>
    <path d="M4 18 L30 32 L30 58 L4 44 Z" fill="#1d4ed8" opacity="0.9"/>
    <path d="M30 32 L56 18 L56 44 L30 58 Z" fill="#1e40af"/>
    <!-- Fold highlight tape -->
    <path d="M26 6 L34 10 L34 30 L26 26 Z" fill="#60a5fa" opacity="0.6"/>
    <!-- Letter mark A on front -->
    <path d="M14 45 L18 29 L22 45 M15 41 L21 41" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <text x="74" y="38" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="1">
    ADBPACK
  </text>
  <text x="75" y="54" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#2563eb" letter-spacing="2">
    D BHARTY'S ENTERPRISES
  </text>
  <text x="75" y="66" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="8" fill="#64748b" letter-spacing="0.5">
    PACKAGING &amp; PRINTING SOLUTIONS
  </text>
</svg>
