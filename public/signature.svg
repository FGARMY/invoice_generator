<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <!-- Stylized Authorized Signature in smooth dark navy ink -->
  <g fill="none" stroke="#1e3a8a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capital D starting stroke & loop -->
    <path d="M 25 50 C 22 36, 26 22, 32 15 C 38 10, 48 10, 52 18 C 56 26, 48 42, 28 46 C 45 44, 70 38, 85 28" stroke-width="2.6"/>
    <!-- Period -->
    <circle cx="91" cy="34" r="1.6" fill="#1e3a8a"/>
    <!-- Letter B and loops -->
    <path d="M 102 16 L 102 52 M 102 24 C 112 18, 126 22, 122 32 C 118 39, 104 38, 102 38 C 114 38, 130 40, 128 50 C 124 56, 108 55, 96 52" stroke-width="2.3"/>
    <!-- H and a-r-t-y flourishes -->
    <path d="M 124 45 C 132 38, 138 34, 142 44 C 144 48, 146 50, 150 44 C 154 36, 158 48, 162 45 C 166 42, 172 30, 175 48 C 177 56, 170 64, 162 60 C 158 58, 162 50, 172 46" stroke-width="2"/>
    <!-- Underline flourish with tail -->
    <path d="M 38 58 C 75 56, 125 54, 185 46" stroke-width="1.8"/>
    <path d="M 160 52 C 172 50, 186 47, 192 45" stroke-width="1.2"/>
  </g>
</svg>
